<script>(function(){
'use strict';
// ---- Saarepagar audio (Echo): every sound and all the music, synthesized with WebAudio. No files, no network.
// API (DESIGN.md):  sfx(name, opts)   MUSIC.scene(name, {area})   AU.unlock()   AU.setVolume('music'|'sfx', v)
//                   AU.muted / AU.setMuted(b)   AU.stats()   AU.lite (no reverb, fewer nodes; auto on <= 4 cores)
// Tests: window.__saAudio (= AU), window.__saMusic (= MUSIC), AU.meter(true) then AU.stats().meter (LUFS, true peak, bands).
// Mix: sfx bus + music bus (ducked by big moments) -> mute -> page fade -> low cut, soft top -> limiter -> soft clipper
// (ceiling 0.88, about -1.1 dBFS). Music sits around -24 LUFS; sounds speak over it.
const AU = (function () {
  const W = typeof window !== 'undefined' ? window : {}, NAV = typeof navigator !== 'undefined' ? navigator : {};
  const DOC = typeof document !== 'undefined' ? document : null;
  const hasOwn = (o, k) => Object.prototype.hasOwnProperty.call(o, k);
  const cl = (v, a, b) => (v < a ? a : v > b ? b : v);
  const rnd = Math.random, pick = (a) => a[(rnd() * a.length) | 0];
  const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);
  let LITE = NAV.hardwareConcurrency > 0 && NAV.hardwareConcurrency <= 4;
  let PHONE = false; try { PHONE = !!(W.matchMedia && W.matchMedia('(pointer: coarse)').matches); } catch (e) {}
  // iPhone: play like media, so the silent switch doesn't mute the game. Set early and again at unlock.
  try { if (NAV.audioSession) NAV.audioSession.type = 'playback'; } catch (e) {}

  let ctx = null, sr = 48000, NB = null, REV = null, hidden = false, hideTimer = 0, timer = 0;
  const B = {}; // buses
  const WV = {}; // periodic waves
  const VOL = { music: 1, sfx: 1 };
  const ST = { names: {}, made: 0, dropped: 0, err: '', nodeRate: 0, nrMade: 0, nrT: 0 };
  const act = []; // live sfx events {name, end}
  let muted = false;

  // ---------- node helpers (each counts toward the node rate, a CPU proxy for weak phones) ----------
  function G(dest, v) { const g = ctx.createGain(); g.gain.value = v; if (dest) g.connect(dest); ST.made++; return g; }
  function F(dest, type, f, q) { const b = ctx.createBiquadFilter(); b.type = type; b.frequency.value = f; if (q !== undefined) b.Q.value = q; if (dest) b.connect(dest); ST.made++; return b; }
  function O(w, f, t) { const o = ctx.createOscillator(); if (typeof w === 'string') o.type = w; else o.setPeriodicWave(w); o.frequency.setValueAtTime(f, t); ST.made++; return o; }
  function fin(src, t0, t1, last) { src.start(t0); src.stop(t1); src.onended = () => { try { last.disconnect(); } catch (e) {} }; }
  function wave(h) { const re = new Float32Array(h.length), im = new Float32Array(h.length); for (let i = 1; i < h.length; i++) im[i] = h[i]; return ctx.createPeriodicWave(re, im); }

  // One voice: oscillator (glide optional) -> optional low-pass (sweep optional) -> envelope. Returns the end time.
  function tone(t, o) {
    const a = o.a !== undefined ? o.a : 0.005, d = o.d !== undefined ? o.d : 0.2, h = o.h || 0, v = o.v || 0.1;
    const g = G(o.dest || B.sfxIn, 0); let n = g;
    if (o.lp) { const f = F(g, 'lowpass', o.lp, o.q || 0.7); if (o.lp2) { f.frequency.setValueAtTime(o.lp, t); f.frequency.exponentialRampToValueAtTime(o.lp2, t + a + h + d * 0.7); } n = f; }
    const os = O(o.w || 'sine', o.f, t);
    if (o.f2) os.frequency.exponentialRampToValueAtTime(o.f2, t + (o.gt || a + d));
    if (o.det) os.detune.value = o.det;
    os.connect(n);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + a); if (h) g.gain.setValueAtTime(v, t + a + h);
    g.gain.exponentialRampToValueAtTime(0.0003, t + a + h + d);
    const e = t + a + h + d + 0.03; fin(os, t, e, g); return e;
  }
  // Filtered noise burst (a slice of a shared noise buffer).
  function noise(t, o) {
    const a = o.a !== undefined ? o.a : 0.003, d = o.d !== undefined ? o.d : 0.08, v = o.v || 0.05;
    const g = G(o.dest || B.sfxIn, 0), f = F(g, o.type || 'bandpass', o.f || 1000, o.q || 1);
    if (o.f2) { f.frequency.setValueAtTime(o.f, t); f.frequency.exponentialRampToValueAtTime(o.f2, t + a + d); }
    const s = ctx.createBufferSource(); ST.made++; s.buffer = NB; s.connect(f);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + a); g.gain.exponentialRampToValueAtTime(0.0003, t + a + d);
    const len = a + d + 0.03; s.start(t, rnd() * (NB.duration - len - 0.01), len); s.onended = () => { try { g.disconnect(); } catch (e) {} };
    return t + len;
  }

  // ---------- instruments (shared by music and fanfares) ----------
  const INS = {
    // Kannel: a bright pluck that dulls as it rings. 3 nodes (2 in lite).
    kannel(t, m, dur, v, dest) {
      const f = mtof(m), ring = cl(1.9 - (m - 60) * 0.03, 0.7, 2.4), g = G(dest, 0); let n = g;
      if (!LITE) { const lp = F(g, 'lowpass', 4200, 0.6); lp.frequency.setValueAtTime(4200, t); lp.frequency.exponentialRampToValueAtTime(1100, t + 0.5); n = lp; }
      const o = O(WV.kannel, f, t); o.detune.value = (rnd() - 0.5) * 8; o.connect(n);
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + 0.004); g.gain.exponentialRampToValueAtTime(v * 0.35, t + 0.18); g.gain.exponentialRampToValueAtTime(0.0003, t + ring);
      fin(o, t, t + ring + 0.03, g);
    },
    // Accordion: two reeds a few cents apart through a soft low-pass, with a little bellows swell. 4 nodes (3 in lite).
    acc(t, m, dur, v, dest) {
      const f = mtof(m), g = G(dest, 0), lp = F(g, 'lowpass', cl(f * 4, 900, 2400), 0.8), e = t + dur + 0.14;
      const o1 = O(WV.reed, f, t); o1.detune.value = -6; o1.connect(lp);
      if (!LITE) { const o2 = O(WV.reed, f, t); o2.detune.value = 7; o2.connect(lp); o2.start(t); o2.stop(e); }
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v * 0.8, t + 0.045); g.gain.linearRampToValueAtTime(v, t + Math.min(dur * 0.6, 0.35));
      g.gain.setValueAtTime(v, t + dur); g.gain.linearRampToValueAtTime(0, t + dur + 0.12);
      fin(o1, t, e, g);
    },
    // Soft nylon guitar: a pluck through a closing low-pass. 3 nodes.
    guitar(t, m, dur, v, dest) {
      const f = mtof(m), g = G(dest, 0), lp = F(g, 'lowpass', 2600, 0.5), d = Math.min(dur + 0.4, 1.5);
      lp.frequency.setValueAtTime(2600, t); lp.frequency.exponentialRampToValueAtTime(650, t + 0.3);
      const o = O(WV.guitar, f, t); o.connect(lp);
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + 0.005); g.gain.exponentialRampToValueAtTime(0.0003, t + d);
      fin(o, t, t + d + 0.03, g);
    },
    // Wooden flute / whistle: breathy attack and a late vibrato. 2 nodes.
    flute(t, m, dur, v, dest) {
      const f = mtof(m), g = G(dest, 0), o = O(WV.flute, f, t), e = t + dur + 0.16;
      if (dur > 0.4) { const n = Math.max(8, Math.ceil(dur * 90)), c = new Float32Array(n); for (let i = 0; i < n; i++) { const x = i / (n - 1); c[i] = Math.sin(x * dur * 5.5 * 2 * Math.PI) * 14 * Math.min(1, x * 3); } o.detune.setValueCurveAtTime(c, t + 0.15, dur - 0.1); }
      o.connect(g);
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + 0.06); g.gain.setValueAtTime(v * 0.9, t + dur); g.gain.linearRampToValueAtTime(0, t + dur + 0.14);
      fin(o, t, e, g);
    },
    // Music box / soft bell: odd partials, a long ring. 2 nodes.
    bell(t, m, dur, v, dest) {
      const f = mtof(m), g = G(dest, 0), o = O(WV.box, f, t), ring = cl(1.6 - (m - 72) * 0.03, 0.6, 2);
      o.connect(g); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + 0.003); g.gain.exponentialRampToValueAtTime(0.0003, t + ring);
      fin(o, t, t + ring + 0.03, g);
    },
    // Upright-ish bass: fundamental plus a few harmonics so a phone speaker still hints at it. 2 nodes.
    bass(t, m, dur, v, dest) {
      const f = mtof(m), g = G(dest, 0), o = O(WV.bass, f, t); o.connect(g);
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + 0.012); g.gain.exponentialRampToValueAtTime(v * 0.3, t + dur); g.gain.linearRampToValueAtTime(0, t + dur + 0.08);
      fin(o, t, t + dur + 0.1, g);
    },
    kick(t, v, dest) { tone(t, { f: 130, f2: 60, gt: 0.12, a: 0.003, d: 0.22, v: v, dest: dest }); },
    shaker(t, v, dest) { if (LITE && rnd() < 0.4) return; noise(t, { f: 3800, q: 0.8, a: 0.012, d: 0.05, v: v, dest: dest }); },
    knock(t, v, dest) { tone(t, { w: 'triangle', f: 640, f2: 520, a: 0.002, d: 0.06, v: v, dest: dest }); },
    frame(t, v, dest) { tone(t, { f: 150, f2: 92, gt: 0.1, a: 0.004, d: 0.3, v: v, dest: dest }); if (!LITE) noise(t, { type: 'lowpass', f: 700, q: 0.5, d: 0.06, v: v * 0.5, dest: dest }); },
  };

  // ---------- sounds ----------
  const PENT = [0, 2, 4, 7, 9];
  const pent = (i) => 12 * Math.floor(i / 5) + PENT[((i % 5) + 5) % 5];
  let lastMerge = -9, streak = 0;
  // A key for jingles: the current music's tonic (so fanfares sit in the song), C otherwise.
  const keyRoot = () => (MU.E ? MU.E.c.root : 60);
  const SFX = {
    pick(t) { // a little lift
      tone(t, { f: 480, f2: 760, gt: 0.06, a: 0.004, d: 0.08, v: 0.14 });
      tone(t + 0.01, { w: 'triangle', f: 1100, f2: 1400, a: 0.002, d: 0.05, v: 0.025 });
      return t + 0.12;
    },
    drop(t, o) { // soft thud on cloth / wood
      const k = 0.94 + rnd() * 0.12;
      tone(t, { f: 200 * k, f2: 88 * k, gt: 0.09, a: 0.003, d: 0.14, v: 0.34 });
      noise(t, { type: 'lowpass', f: 900, q: 0.7, a: 0.002, d: 0.05, v: 0.16 });
      tone(t + 0.005, { w: 'triangle', f: 420 * k, a: 0.002, d: 0.035, v: 0.05 });
      return t + 0.2;
    },
    swap(t) {
      INS.kannel(t, 76, 0.2, 0.09, B.sfxIn); INS.kannel(t + 0.07, 71, 0.2, 0.08, B.sfxIn);
      tone(t, { f: 180, f2: 100, a: 0.003, d: 0.1, v: 0.18 });
      return t + 0.3;
    },
    merge(t, o) { // sparkly pop; pitch rises with the new item's level, the sparkle with a merge streak
      const L = cl((o && +o.level) || 1, 1, 14), base = 62 + pent(L - 1), f = mtof(base);
      streak = t - lastMerge < 1.4 ? Math.min(streak + 1, 6) : 0; lastMerge = t;
      tone(t, { f: f * 0.55, f2: f, gt: 0.045, a: 0.003, d: 0.12, v: 0.26 }); // the pop
      tone(t, { w: 'triangle', f: f * 0.5, a: 0.004, d: 0.18, v: 0.12, lp: 1400 }); // body
      noise(t, { type: 'lowpass', f: 1600, q: 0.6, a: 0.002, d: 0.04, v: 0.1 }); // puff
      const sp = [0, 2, 4, 5, 7], s0 = streak % 3;
      for (let i = 0; i < 3; i++) INS.bell(t + 0.05 + i * 0.045, base + 12 + pent(sp[i] + s0) - (i === 2 ? 0 : 0), 0.3, 0.055 - i * 0.008, B.sfxIn);
      return t + 0.45;
    },
    mergeMax(t, o) { // celebratory chime
      duck(0.45, 1.4);
      const r = keyRoot() + 12, ch = [0, 4, 7, 12, 16, 19];
      tone(t, { f: 330, f2: 660, gt: 0.05, a: 0.003, d: 0.15, v: 0.26 });
      tone(t, { f: 110, f2: 70, a: 0.005, d: 0.4, v: 0.2 });
      for (let i = 0; i < ch.length; i++) INS.kannel(t + 0.04 + i * 0.07, r + ch[i], 0.5, 0.11, B.sfxIn);
      for (let i = 0; i < 3; i++) INS.bell(t + 0.5 + i * 0.09, r + 24 + [0, 4, 7][i], 0.5, 0.05, B.sfxIn);
      INS.acc(t + 0.42, r, 0.7, 0.05, B.sfxIn); INS.acc(t + 0.42, r + 4, 0.7, 0.04, B.sfxIn); INS.acc(t + 0.42, r + 7, 0.7, 0.04, B.sfxIn);
      return t + 2;
    },
    spawn(t) { // the oven's "pling"
      const f = pick([1047, 1175, 1319]);
      tone(t, { f: 260, f2: 560, gt: 0.05, a: 0.003, d: 0.06, v: 0.12 }); // a little pop out
      noise(t, { f: 600, f2: 1800, q: 1.2, a: 0.02, d: 0.1, v: 0.035 });
      tone(t + 0.04, { f: f, a: 0.002, d: 0.55, v: 0.11 });
      tone(t + 0.04, { f: f * 2.76, a: 0.002, d: 0.12, v: 0.018 });
      return t + 0.65;
    },
    noEnergy(t) { // a soft deflate
      tone(t, { w: 'triangle', f: 392, f2: 350, a: 0.01, h: 0.06, d: 0.14, v: 0.13, lp: 1300 });
      tone(t + 0.17, { w: 'triangle', f: 330, f2: 247, gt: 0.25, a: 0.01, h: 0.05, d: 0.25, v: 0.12, lp: 1100 });
      noise(t + 0.17, { type: 'lowpass', f: 700, f2: 250, q: 0.5, a: 0.05, d: 0.25, v: 0.03 });
      return t + 0.6;
    },
    bubble(t) { // watery bloop-bloop
      tone(t, { f: 360, f2: 880, gt: 0.08, a: 0.004, d: 0.12, v: 0.14 });
      tone(t + 0.08, { f: 520, f2: 1100, gt: 0.07, a: 0.004, d: 0.1, v: 0.09 });
      return t + 0.25;
    },
    bubblePop(t) {
      noise(t, { f: 1800, q: 1.4, a: 0.001, d: 0.045, v: 0.2 });
      tone(t, { f: 1300, f2: 480, gt: 0.05, a: 0.001, d: 0.06, v: 0.16 });
      INS.bell(t + 0.04, 88, 0.3, 0.04, B.sfxIn);
      return t + 0.4;
    },
    chest(t) { // creak, lid, a little magic
      duck(0.6, 1.2);
      tone(t, { w: 'sawtooth', f: 130, f2: 190, gt: 0.25, a: 0.04, h: 0.12, d: 0.1, v: 0.05, lp: 800, q: 4 });
      tone(t + 0.28, { f: 170, f2: 80, a: 0.003, d: 0.16, v: 0.26 });
      noise(t + 0.28, { type: 'lowpass', f: 800, d: 0.06, v: 0.1 });
      const r = keyRoot() + 24, s = [0, 2, 4, 7, 9, 12];
      for (let i = 0; i < s.length; i++) INS.bell(t + 0.36 + i * 0.06, r + s[i], 0.4, 0.05, B.sfxIn);
      return t + 1.4;
    },
    order(t) { // a soft shop-door ding-dong
      INS.bell(t, 76, 0.4, 0.09, B.sfxIn); INS.bell(t + 0.2, 72, 0.6, 0.08, B.sfxIn);
      return t + 1;
    },
    orderDone(t) { // cozy "kassa": a ratchet, two bells, coins
      duck(0.6, 1);
      for (let i = 0; i < 3; i++) noise(t + i * 0.035, { f: 2600, q: 3, a: 0.001, d: 0.02, v: 0.06 });
      tone(t + 0.12, { f: 784, a: 0.003, d: 0.7, v: 0.1 }); tone(t + 0.12, { f: 988, a: 0.003, d: 0.7, v: 0.08 });
      tone(t + 0.26, { f: 1175, a: 0.003, d: 0.9, v: 0.09 });
      coinTinks(t + 0.18, 3);
      return t + 1.2;
    },
    coins(t, o) { coinTinks(t, cl((o && o.n) | 0 || 3, 1, 6)); return t + 0.5; },
    stars(t, o) { // a rising twinkle
      const n = cl((o && o.n) | 0 || 5, 3, 7), r = keyRoot() + 12;
      for (let i = 0; i < n; i++) INS.bell(t + i * 0.055, r + 7 + pent(i + 2), 0.3, 0.05, B.sfxIn);
      tone(t, { f: 523, f2: 1047, gt: 0.3, a: 0.05, d: 0.3, v: 0.03 });
      return t + 0.9;
    },
    taskDone(t) { fanfare(t, false); return t + 1.6; },
    levelUp(t) { fanfare(t, true); return t + 2.2; },
    daily(t) { // a music box plays the theme's opening
      duck(0.5, 2);
      const r = keyRoot() + 12, mel = [[7, 0], [7, 0.18], [9, 0.27], [7, 0.36], [4, 0.54], [5, 0.75], [4, 0.84], [2, 0.93], [4, 1.1]];
      for (let i = 0; i < mel.length; i++) INS.bell(t + mel[i][1], r + mel[i][0], 0.4, 0.07, B.sfxIn);
      INS.kannel(t + 1.1, r - 12, 1, 0.07, B.sfxIn); INS.kannel(t + 1.13, r - 5, 1, 0.05, B.sfxIn);
      return t + 2;
    },
    tap(t) { tone(t, { f: 1050, f2: 880, a: 0.002, d: 0.035, v: 0.07 }); noise(t, { f: 2400, q: 2, a: 0.001, d: 0.012, v: 0.03 }); return t + 0.06; },
    open(t) { noise(t, { f: 500, f2: 1500, q: 1.2, a: 0.03, d: 0.1, v: 0.05 }); tone(t + 0.02, { f: 440, f2: 660, gt: 0.08, a: 0.005, d: 0.1, v: 0.07 }); return t + 0.18; },
    close(t) { noise(t, { f: 1500, f2: 500, q: 1.2, a: 0.03, d: 0.1, v: 0.045 }); tone(t + 0.02, { f: 620, f2: 420, gt: 0.08, a: 0.005, d: 0.09, v: 0.06 }); return t + 0.18; },
    sell(t) { noise(t, { f: 1400, f2: 400, q: 1, a: 0.02, d: 0.12, v: 0.04 }); tone(t, { f: 900, f2: 600, gt: 0.1, a: 0.004, d: 0.1, v: 0.06 }); coinTinks(t + 0.08, 2); return t + 0.4; },
    deny(t) { // a gentle "uh-uh"
      tone(t, { w: 'triangle', f: 330, a: 0.012, h: 0.06, d: 0.08, v: 0.12, lp: 1400 });
      tone(t + 0.15, { w: 'triangle', f: 294, a: 0.012, h: 0.06, d: 0.12, v: 0.11, lp: 1300 });
      return t + 0.4;
    },
    talk(t, o) { return voice(t, (o && o.who) || 'mina', o && o.ch); },
  };
  function coinTinks(t, n) {
    for (let i = 0; i < n; i++) {
      const tt = t + i * 0.06 + rnd() * 0.02, f = 1500 + rnd() * 600;
      tone(tt, { f: f, a: 0.001, d: 0.14, v: 0.05 }); tone(tt, { f: f * 1.5, a: 0.001, d: 0.07, v: 0.02 });
    }
  }
